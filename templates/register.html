{% extends "base.html" %}{% block title %}Sign up · Cookie Sesh{% endblock %}{% block content %}
<div class="form-card"><h1>Create an account</h1><p>Join the Cookie Sesh community.</p>
<form method="post">
<label>Username<input name="username" required maxlength="80"></label>
<label>Email<input type="email" name="email" required maxlength="120"></label>
<label>Password<input type="password" name="password" required></label>
<button class="button" type="submit">Create account</button>
</form><p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div>
{% endblock %}
