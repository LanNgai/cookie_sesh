{% extends "base.html" %}{% block title %}Submit a fortune · Cookie Sesh{% endblock %}{% block content %}
<div class="form-card"><h1>Share a little wisdom</h1><p>Your fortune will be reviewed by an administrator before appearing in the collection.</p>
<form method="post">
<label>Your fortune<textarea name="content" rows="4" maxlength="500" required placeholder="Something thoughtful, hopeful or inspiring..."></textarea></label>
<label>Category<select name="category"><option>General</option><option>Motivation</option><option>Life</option><option>Friendship</option><option>Adventure</option><option>Kindness</option></select></label>
<button class="button" type="submit">Submit for approval</button></form></div>
{% endblock %}
